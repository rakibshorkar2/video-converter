name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      with_ffmpeg:
        description: "Build with FFmpeg support (runs Scripts/build_ffmpeg_ios.sh)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=""
          LATEST_NUM="0"
          for d in /Applications/Xcode*.app; do
            [ -d "$d" ] || continue
            VER=$(defaults read "$d/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "0.0")
            MAJ=${VER%%.*}
            MIN=${VER#*.}; MIN=${MIN%%.*}
            NUM=$((MAJ * 1000 + MIN))
            if [ "$NUM" -gt "$LATEST_NUM" ]; then
              LATEST="$d"; LATEST_NUM="$NUM"
            fi
          done
          echo "Installed Xcodes: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          echo "Selected: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build FFmpeg (optional)
        if: ${{ github.event.inputs.with_ffmpeg == 'true' }}
        run: |
          brew install automake autoconf libtool pkg-config yasm
          ./Scripts/build_ffmpeg_ios.sh
          xcodegen generate

      - name: Compute build number
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            BUILD=1
            VERSION="v1.0.1"
          else
            PATCH=${LATEST_TAG##*.}
            BUILD=$((PATCH + 1))
            VERSION="v1.0.$BUILD"
          fi
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next build: $VERSION (build $BUILD)"

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project VideoConverter.xcodeproj \
            -scheme VideoConverter \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build_number || '1' }} \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoConverter-unsigned
          path: build/Build/Products/Release-iphoneos/VideoConverter.app
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD="${{ steps.version.outputs.build_number }}"
          VERSION="${{ steps.version.outputs.version }}"
          cd build/Build/Products/Release-iphoneos
          zip -r "VideoConverter-$VERSION.zip" VideoConverter.app
          gh release create "$VERSION" "VideoConverter-$VERSION.zip" \
            --title "VideoConverter $VERSION (build $BUILD)" \
            --generate-notes

      - name: Notify on failure
        if: failure()
        run: echo "::error::Build failed — check the log above."